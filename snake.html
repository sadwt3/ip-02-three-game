<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a2a3a 0%, #0d1520 100%);
    color: #e8eef4;
    user-select: none;
  }
  h1 {
    margin-bottom: 12px;
    font-size: 28px;
    letter-spacing: 4px;
    color: #7ee787;
    text-shadow: 0 0 12px rgba(126, 231, 135, 0.4);
  }
  #info {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 16px;
  }
  #info span { color: #9fb3c8; }
  #info b { color: #ffd76e; font-size: 18px; }
  #wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  canvas { display: block; background: #101826; }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 16, 24, 0.78);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    backdrop-filter: blur(2px);
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 30px; color: #ffd76e; }
  #overlay p { color: #b8c8d8; font-size: 15px; line-height: 1.8; text-align: center; }
  #overlay button {
    padding: 10px 36px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #2ea043;
    color: #fff;
    transition: transform 0.15s, background 0.15s;
  }
  #overlay button:hover { background: #3ecf5a; transform: scale(1.05); }
  #hint { margin-top: 14px; font-size: 13px; color: #6e8298; }
</style>
</head>
<body>
  <h1>贪 吃 蛇</h1>
  <div id="info">
    <div><span>得分：</span><b id="score">0</b></div>
    <div><span>最高分：</span><b id="best">0</b></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay">
      <h2 id="ovTitle">准备开始</h2>
      <p id="ovText">使用方向键 / WASD 控制移动<br>场上同时有多个食物，小心灰色障碍物<br>撞墙、撞自己或撞障碍物游戏结束</p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div id="hint">空格键：暂停 / 继续</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  const GRID = 24;                 // 每格像素
  const COLS = canvas.width / GRID;
  const ROWS = canvas.height / GRID;

  let snake, dir, nextDir, foods, score, best, speed, timer, state, obstacles;
  const FOOD_COUNT = 3;   // 场上同时存在的食物数量
  const OBSTACLE_COUNT = 15; // 随机障碍物数量
  best = Number(localStorage.getItem('snakeBest') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 8, y: 12}, {x: 7, y: 12}, {x: 6, y: 12}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = 140;
    scoreEl.textContent = '0';
    genObstacles();
    foods = [];
    for (let i = 0; i < FOOD_COUNT; i++) placeFood();
  }

  // 生成随机障碍物：避开蛇身及其正前方若干格，避免生成即撞
  function genObstacles() {
    obstacles = [];
    const danger = new Set(snake.map(s => s.x + ',' + s.y));
    for (let i = 1; i <= 5; i++) danger.add((snake[0].x + i) + ',' + snake[0].y);
    let guard = 0;
    while (obstacles.length < OBSTACLE_COUNT && guard++ < 500) {
      const x = Math.floor(Math.random() * COLS);
      const y = Math.floor(Math.random() * ROWS);
      const key = x + ',' + y;
      if (danger.has(key)) continue;
      if (obstacles.some(o => o.x === x && o.y === y)) continue;
      // 避免与蛇同排正前紧邻：上方已处理；额外保证不完全封死不做过强检查
      obstacles.push({x, y});
      danger.add(key);
    }
  }

  function placeFood() {
    let guard = 0;
    while (guard++ < 500) {
      const f = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
      const onSnake = snake.some(s => s.x === f.x && s.y === f.y);
      const onObstacle = obstacles.some(o => o.x === f.x && o.y === f.y);
      const onFood = foods.some(fd => fd.x === f.x && fd.y === f.y);
      if (!onSnake && !onObstacle && !onFood) { foods.push(f); return; }
    }
  }

  function tick() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // 撞墙 / 撞自己 / 撞障碍物
    const hitObstacle = obstacles.some(o => o.x === head.x && o.y === head.y);
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        hitObstacle ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    const idx = foods.findIndex(f => f.x === head.x && f.y === head.y);
    if (idx !== -1) {
      foods.splice(idx, 1);
      placeFood();          // 补充一个新食物，保持场上数量
      score += 10;
      scoreEl.textContent = score;
      // 提速
      if (speed > 60) {
        speed -= 3;
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    // 背景
    ctx.fillStyle = '#101826';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i*GRID, 0); ctx.lineTo(i*GRID, canvas.height); ctx.stroke();
    }
    for (let j = 1; j < ROWS; j++) {
      ctx.beginPath(); ctx.moveTo(0, j*GRID); ctx.lineTo(canvas.width, j*GRID); ctx.stroke();
    }

    // 障碍物
    for (const o of obstacles) {
      ctx.fillStyle = '#5a6a7d';
      ctx.strokeStyle = '#8fa3b8';
      ctx.lineWidth = 1.5;
      roundRect(o.x*GRID + 2, o.y*GRID + 2, GRID - 4, GRID - 4, 3);
      ctx.fill();
      ctx.stroke();
      // 内部斜纹增加辨识度
      ctx.strokeStyle = 'rgba(143,163,184,0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(o.x*GRID + 5, o.y*GRID + GRID - 5);
      ctx.lineTo(o.x*GRID + GRID - 5, o.y*GRID + 5);
      ctx.stroke();
    }

    // 食物
    ctx.shadowBlur = 12;
    for (const f of foods) {
      const fx = f.x * GRID + GRID/2, fy = f.y * GRID + GRID/2;
      ctx.fillStyle = '#ff5f5f';
      ctx.shadowColor = '#ff5f5f';
      ctx.beginPath();
      ctx.arc(fx, fy, GRID/2 - 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // 蛇身
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(snake.length - 1, 1);
      const g = Math.round(231 - t * 90);
      const b = Math.round(135 - t * 60);
      ctx.fillStyle = i === 0 ? '#aaffaa' : `rgb(${Math.round(126 - t*40)},${g},${b})`;
      const pad = i === 0 ? 2 : 3;
      roundRect(s.x*GRID + pad, s.y*GRID + pad, GRID - pad*2, GRID - pad*2, 5);
      ctx.fill();
    }

    // 蛇眼睛
    const h = snake[0];
    ctx.fillStyle = '#0d1520';
    const ex = h.x * GRID, ey = h.y * GRID;
    if (dir.x !== 0) {
      ctx.fillRect(ex + (dir.x > 0 ? 13 : 6), ey + 7, 4, 4);
      ctx.fillRect(ex + (dir.x > 0 ? 13 : 6), ey + 13, 4, 4);
    } else {
      ctx.fillRect(ex + 7, ey + (dir.y > 0 ? 13 : 6), 4, 4);
      ctx.fillRect(ex + 13, ey + (dir.y > 0 ? 13 : 6), 4, 4);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function gameOver() {
    clearInterval(timer);
    state = 'over';
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      bestEl.textContent = best;
      ovTitle.textContent = '游戏结束 🎉 新纪录！';
    } else {
      ovTitle.textContent = '游戏结束';
    }
    ovText.innerHTML = `本局得分：<b style="color:#ffd76e">${score}</b>，蛇的长度：${snake.length}<br>按下方按钮或空格键再来一局`;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function start() {
    reset();
    draw();
    overlay.classList.add('hidden');
    state = 'playing';
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function pause() {
    if (state === 'playing') {
      clearInterval(timer);
      state = 'paused';
      ovTitle.textContent = '已暂停';
      ovText.textContent = '按空格键继续';
      startBtn.textContent = '继续';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      overlay.classList.add('hidden');
      state = 'playing';
      timer = setInterval(tick, speed);
    } else if (state === 'over') {
      start();
    }
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k === ' ' ? ' ' : k)) e.preventDefault();
    if (k === ' ') { pause(); return; }
    if (state !== 'playing') return;
    if ((k === 'arrowup' || k === 'w') && dir.y === 0) nextDir = {x: 0, y: -1};
    else if ((k === 'arrowdown' || k === 's') && dir.y === 0) nextDir = {x: 0, y: 1};
    else if ((k === 'arrowleft' || k === 'a') && dir.x === 0) nextDir = {x: -1, y: 0};
    else if ((k === 'arrowright' || k === 'd') && dir.x === 0) nextDir = {x: 1, y: 0};
  });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') pause();
    else start();
  });

  // 初始画面
  state = 'idle';
  reset();
  draw();
})();
</script>
</body>
</html>
